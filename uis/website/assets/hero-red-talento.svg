<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" role="img"
     aria-labelledby="hero-svg-titulo">
  <title id="hero-svg-titulo">Red de profesionales conectados a un proceso de selección</title>

  <!-- Formas de fondo -->
  <circle cx="300" cy="185" r="158" fill="#184478" opacity=".55"/>
  <circle cx="132" cy="292" r="88" fill="#336fb4" opacity=".30"/>
  <circle cx="432" cy="92" r="62" fill="#578dcd" opacity=".24"/>

  <!-- Conexiones desde el nodo central -->
  <g stroke="#8ab0e0" stroke-width="2" opacity=".55" fill="none">
    <path d="M268 196 L128 110"/>
    <path d="M268 196 L406 100"/>
    <path d="M268 196 L432 258"/>
    <path d="M268 196 L152 300"/>
    <path d="M268 196 L306 340"/>
  </g>

  <!-- Nodo central: la vacante cubierta -->
  <g transform="translate(268 196)">
    <circle r="46" fill="#ffffff"/>
    <circle r="46" fill="none" stroke="#f7c14f" stroke-width="4"/>
    <circle cy="-11" r="14" fill="#184478"/>
    <path d="M-20 21a20 20 0 0 1 40 0z" fill="#184478"/>
    <g transform="translate(30 -30)">
      <circle r="14" fill="#eda820"/>
      <path d="M-6 0 L-2 5 L6 -5" fill="none" stroke="#ffffff" stroke-width="2.6"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Candidatos de la red -->
  <g fill="#ffffff" stroke="#b7cfee" stroke-width="2">
    <circle cx="128" cy="110" r="30"/>
    <circle cx="406" cy="100" r="26"/>
    <circle cx="432" cy="258" r="28"/>
    <circle cx="152" cy="300" r="26"/>
    <circle cx="306" cy="340" r="24"/>
  </g>
  <g fill="#578dcd">
    <g transform="translate(128 110)"><circle cy="-7" r="9" /><path d="M-13 14a13 13 0 0 1 26 0z"/></g>
    <g transform="translate(406 100)"><circle cy="-6" r="8" /><path d="M-11 12a11 11 0 0 1 22 0z"/></g>
    <g transform="translate(432 258)"><circle cy="-7" r="8.5"/><path d="M-12 13a12 12 0 0 1 24 0z"/></g>
    <g transform="translate(152 300)"><circle cy="-6" r="8" /><path d="M-11 12a11 11 0 0 1 22 0z"/></g>
    <g transform="translate(306 340)"><circle cy="-6" r="7.5"/><path d="M-10 11a10 10 0 0 1 20 0z"/></g>
  </g>
</svg>
